name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}, Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 5.2 LTS: Python 3.10 to 3.14
          - { python: "3.10", django: "5.2" }
          - { python: "3.11", django: "5.2" }
          - { python: "3.12", django: "5.2" }
          - { python: "3.13", django: "5.2" }
          - { python: "3.14", django: "5.2" }
          # Django 6.0: Python 3.12 to 3.14
          - { python: "3.12", django: "6.0" }
          - { python: "3.13", django: "6.0" }
          - { python: "3.14", django: "6.0" }
          # Django 6.1: Python 3.12 to 3.15
          - { python: "3.12", django: "6.1" }
          - { python: "3.13", django: "6.1" }
          - { python: "3.14", django: "6.1" }
          - { python: "3.15", django: "6.1" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev "Django~=${{ matrix.django }}.0"
      - run: pytest
      - name: With the real django-allauth and django-otp
        run: |
          python -m pip install --group signin "Django~=${{ matrix.django }}.0"
          pytest --ds=tests.settings_signin tests/signin

  phone-verify:
    name: django-phone-verify, Python ${{ matrix.python }}, Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", django: "5.2" }
          - { python: "3.13", django: "6.0" }
          - { python: "3.14", django: "6.1" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # In its own environment: it needs phonenumbers 9, which django-two-factor-auth refuses.
      - run: python -m pip install -e . --group signin-phone-verify "Django~=${{ matrix.django }}.0"
      - run: pytest --ds=tests.settings_signin tests/signin

  without-two-factor:
    name: Without django-two-factor-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest pytest-django
      - run: pytest

  checks:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev --group typing build twine
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m build
      - run: twine check --strict dist/*
